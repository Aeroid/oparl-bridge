[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "oparl-bridge"
version = "0.1.0"
description = "OParl 1.1-compatible API gateway for ALLRIS municipal information systems"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Gunnar Klauberg" }]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "playwright>=1.44.0",
    "sqlalchemy>=2.0.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "aiofiles>=23.0.0",
    "rich>=15.0.0",
]

[project.urls]
Homepage = "https://github.com/aeroid/oparl-bridge"
Repository = "https://github.com/aeroid/oparl-bridge"
Issues = "https://github.com/aeroid/oparl-bridge/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-playwright>=0.5.0",
    "httpx>=0.27.0",
    "ruff>=0.4.0",
    "jsonschema>=4.26.0",
]

[project.scripts]
oparl-bridge = "oparl_bridge.main:main"
oparl-bridge-sync = "oparl_bridge.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/oparl_bridge"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[dependency-groups]
dev = [
    "jsonschema>=4.26.0",
]
