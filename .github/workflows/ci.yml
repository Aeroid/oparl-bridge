name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Lint
        run: uv run ruff check src/

      - name: Test
        run: uv run python -m pytest
        env:
          OPARL_ALLRIS_BASE_URL: "https://example.invalid/allris"
          OPARL_BODY_NAME: "Testgemeinde"
          OPARL_BODY_WEBSITE: "https://example.invalid"
