<!DOCTYPE html>
<html lang="de" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bürgerinformation</title>
    <link rel="alternate" type="text/markdown" href="/md/" title="Markdown-Index">
    <link rel="alternate" type="text/plain" href="/llms.txt" title="LLM-Index">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.classless.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3/dist/cdn.min.js"></script>
    <style>
        html { font-size: 75%; }
        [x-cloak] { display: none !important; }

        :root { --pico-container-max-width: 100%; }
        body > header, body > main, body > footer {
            max-width: 100%;
            padding-inline: 1rem;
        }
        .container-fluid { padding-inline: 0.75rem; }

        .breadcrumb {
            display: flex; gap: 0.4rem; align-items: center;
            flex-wrap: wrap; justify-content: flex-start;
        }
        .breadcrumb .sep { color: var(--pico-muted-color); }
        .nonpublic td { color: var(--pico-muted-color); }
        .files { display: flex; gap: 0.5rem; flex-wrap: wrap; }
        .files a, .files button { font-size: 0.85em; }

        mark { background: #fff3cd; padding: 0 2px; border-radius: 2px; }

        .top-section { color: var(--pico-muted-color); font-style: italic; display: flex; flex-direction: column; gap: 0.55em; }
        .top-section p { margin: 0; }
        .top-section p:first-child { font-weight: 600; font-style: normal; margin-bottom: -0.55em; }

        .result-badge {
            display: inline-block; font-size: 0.7em; font-weight: 600;
            padding: 1px 6px; border-radius: 3px; white-space: nowrap;
            vertical-align: middle; margin-left: 0.3em;
        }
        .result-ACCEPTED  { background: #d4edda; color: #155724; }
        .result-REJECTED  { background: #f8d7da; color: #721c24; }
        .result-DEFERRED  { background: #fff3cd; color: #856404; }
        .result-NODECISION{ background: #e2e3e5; color: #383d41; }

        .top-detail { font-size: 0.85em; color: var(--pico-muted-color); margin-top: 0.3rem; }
        .top-detail p { margin: 0.15rem 0; }

        .md-badge {
            display: inline-block; font-size: 0.55em; font-weight: 700; line-height: 1;
            padding: 2px 5px; border-radius: 3px; vertical-align: middle;
            background: var(--pico-muted-border-color); color: var(--pico-muted-color);
            text-decoration: none; letter-spacing: 0.03em; flex-shrink: 0;
        }
        .md-badge:hover { background: var(--pico-primary); color: #fff; }

        /* Split layout — flex so drag handle can resize the PDF panel */
        .split-layout {
            display: flex;
            height: calc(100vh - 12rem);
            overflow: hidden;
        }
        .split-content { flex: 1 1 auto; overflow-y: auto; min-width: 200px; }
        .split-handle {
            flex: 0 0 5px;
            cursor: col-resize;
            background: var(--pico-muted-border-color);
            margin: 0 2px;
            border-radius: 2px;
            transition: background 0.15s;
        }
        .split-handle:hover { background: var(--pico-primary); }
        .split-pdf { position: relative; flex: 0 0 auto; min-width: 180px; overflow: hidden; }
        .pdf-loading-overlay {
            position: absolute; inset: 0; z-index: 10;
            display: flex; align-items: center; justify-content: center;
            background: rgba(255,255,255,0.75);
            border-radius: var(--pico-border-radius);
        }
        .pdf-spinner {
            width: 2.8rem; height: 2.8rem;
            border: 3px solid var(--pico-muted-border-color);
            border-top-color: var(--pico-primary);
            border-radius: 50%;
            animation: spin 0.75s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .split-pdf iframe {
            width: 100%;
            height: 100%;
            border: 1px solid var(--pico-muted-border-color);
            border-radius: var(--pico-border-radius);
            background: #f5f5f5;
        }
        .split-pdf .pdf-placeholder {
            width: 100%; height: 100%;
            display: flex; align-items: center; justify-content: center;
            border: 1px dashed var(--pico-muted-border-color);
            border-radius: var(--pico-border-radius);
            color: var(--pico-muted-color);
            font-size: 0.9em; text-align: center; padding: 2rem;
        }

        footer { margin-top: 3rem; padding-top: 1rem;
                 border-top: 1px solid var(--pico-muted-border-color); }
        td { vertical-align: top; }
        input[type=search] { margin-bottom: 0; }
        .search-result-meta { font-size: 0.8em; color: var(--pico-muted-color); }

        .tab-nav { display: flex; gap: 1.5rem; border-bottom: 1px solid var(--pico-muted-border-color); margin-bottom: 1rem; }
        .tab-nav a { padding-bottom: 0.4rem; text-decoration: none; color: var(--pico-muted-color); border-bottom: 2px solid transparent; }
        .tab-nav a.active { color: var(--pico-color); border-bottom-color: var(--pico-primary); font-weight: 600; }
    </style>
</head>
<body x-data="app()" x-init="init()" x-cloak>

<header class="container-fluid">
    <div style="display:flex; justify-content:space-between; align-items:center; gap:1rem; flex-wrap:wrap;">
        <div style="display:flex; align-items:center; gap:0.75rem; flex:1 1 auto;">
            <a x-show="municipality?.wappenUrl" :href="municipality?.wikidataUrl"
               target="_blank" rel="noopener" style="flex:0 0 auto; line-height:0;"
               title="Wikidata">
                <img :src="municipality?.wappenUrl" style="height:52px; width:auto;"
                     alt="Wappen">
            </a>
            <hgroup style="margin:0;">
                <h1 x-text="body ? body.name : (body?.systemName || 'Bürgerinformation')"></h1>
                <p x-show="body" style="margin:0; display:flex; gap:0.6rem; align-items:center; flex-wrap:wrap;">
                    <span x-text="body?.systemName || 'Bürgerinformationssystem'"></span>
                    <span style="color:var(--pico-muted-color)">·</span>
                    <a :href="body?.website" target="_blank" x-text="body?.website"></a>
                    <template x-if="municipality?.wikipediaUrl">
                        <span style="color:var(--pico-muted-color)">·</span>
                    </template>
                    <template x-if="municipality?.wikipediaUrl">
                        <a :href="municipality.wikipediaUrl" target="_blank" rel="noopener">Wikipedia</a>
                    </template>
                    <template x-if="municipality?.population">
                        <span style="color:var(--pico-muted-color); font-size:0.85em;"
                              x-text="municipality.population.toLocaleString('de-DE') + ' Einw.'"></span>
                    </template>
                </p>
            </hgroup>
        </div>
        <div style="display:flex; align-items:center; gap:0.5rem; flex:0 0 auto;">
            <input type="search" placeholder="Suche…" x-model="query"
                   @input="onSearch()" style="width:22rem;"
                   :disabled="!allLoaded">
            <small x-show="!allLoaded && loadingAll"
                   style="color:var(--pico-muted-color); white-space:nowrap;">
                Lade Suchindex…
            </small>
        </div>
    </div>
    <nav class="breadcrumb" aria-label="Breadcrumb" style="margin-top:0.5rem;">
        <a href="#" @click.prevent="goOrgs()">Gremien</a>
        <span class="sep">·</span>
        <a href="#" @click.prevent="goPersons()">Personen</a>
        <template x-if="selectedOrg && (view === 'meetings' || view === 'meeting')">
            <span class="sep">›</span>
        </template>
        <template x-if="selectedOrg && view === 'meetings'">
            <span x-text="selectedOrg.orgName"></span>
        </template>
        <template x-if="selectedOrg && view === 'meeting'">
            <a href="#" @click.prevent="goMeetings()" x-text="selectedOrg.orgName"></a>
        </template>
        <template x-if="meeting">
            <span class="sep">›</span>
        </template>
        <template x-if="meeting">
            <span x-text="meeting.name + (meeting.start ? ' (' + formatDateShort(meeting.start) + ')' : '')"></span>
        </template>
    </nav>
</header>

<main class="container-fluid">
    <div x-show="loading" aria-busy="true" style="text-align:center;padding:2rem;"></div>

    <!-- Search results -->
    <template x-if="query.trim() && !loading">
        <section>
            <p x-show="searchResults.length === 0">Keine Ergebnisse für „<span x-text="query"></span>".</p>
            <table x-show="searchResults.length > 0">
                <thead>
                    <tr><th>Sitzung</th><th>Gremium</th><th>TOP</th><th>Betreff</th></tr>
                </thead>
                <tbody>
                    <template x-for="r in searchResults" :key="r.key">
                        <tr style="cursor:pointer" @click="openSearchResult(r)">
                            <td style="white-space:nowrap" x-text="formatDateList(r.start)"></td>
                            <td x-text="r.orgName"></td>
                            <td x-text="r.number || '—'"></td>
                            <td>
                                <span x-html="highlight(r.name)"></span>
                                <template x-if="r.paperRef">
                                    <small class="search-result-meta"> · <span x-html="highlight(r.paperRef)"></span></small>
                                </template>
                            </td>
                        </tr>
                    </template>
                </tbody>
            </table>
        </section>
    </template>

    <!-- Organisations -->
    <template x-if="view === 'orgs' && !loading && !query.trim()">
        <section>
            <table>
                <thead>
                    <tr><th>Organisation</th><th>Letzte Sitzung</th><th>Nächste Sitzung</th></tr>
                </thead>
                <tbody>
                    <template x-for="row in flatOrgRows" :key="row.isHeader ? 'h-'+row.type : row.orgId">
                        <tr>
                            <!-- Gruppenüberschrift -->
                            <td x-show="row.isHeader" colspan="3"
                                style="padding-top:1.25rem; padding-bottom:0.2rem; border-bottom:none;
                                       color:var(--pico-muted-color); font-size:0.8em; font-weight:600;
                                       text-transform:uppercase; letter-spacing:0.05em;"
                                x-text="row.type"></td>
                            <!-- Org-Zeile -->
                            <td x-show="!row.isHeader">
                                <a href="#" @click.prevent="showMeetings(row)"
                                   x-text="row.orgName"></a>
                            </td>
                            <td x-show="!row.isHeader" style="white-space:nowrap">
                                <template x-if="!row.isHeader && row.lastMeetingId">
                                    <a href="#"
                                       @click.prevent="showMeetings(row); showMeeting(allMeetings.find(m => m.id === row.lastMeetingId))"
                                       x-text="formatDateShort(row.lastMeeting)"></a>
                                </template>
                                <template x-if="!row.isHeader && !row.lastMeetingId">
                                    <span>—</span>
                                </template>
                            </td>
                            <td x-show="!row.isHeader" style="white-space:nowrap">
                                <template x-if="!row.isHeader && row.nextMeetingId">
                                    <a href="#"
                                       @click.prevent="showMeetings(row); showMeeting(allMeetings.find(m => m.id === row.nextMeetingId))"
                                       x-text="formatDateList(row.nextMeeting)"></a>
                                </template>
                                <template x-if="!row.isHeader && !row.nextMeetingId">
                                    <span>—</span>
                                </template>
                            </td>
                        </tr>
                    </template>
                </tbody>
            </table>
        </section>
    </template>

    <!-- Meetings list -->
    <template x-if="view === 'meetings' && !loading && !query.trim()">
        <section>
            <h2 style="display:flex; align-items:center; gap:0.4em;">
                <span x-text="selectedOrg?.orgName"></span>
                <a :href="'/md/gremien/' + selectedOrg.orgId" target="_blank" rel="noopener"
                   title="Markdown-Ansicht" class="md-badge">MD</a>
            </h2>

            <nav class="tab-nav">
                <a href="#" @click.prevent="orgTab='meetings'"
                   :class="orgTab==='meetings' ? 'active' : ''">
                    Sitzungen (<span x-text="meetings.length"></span>)
                </a>
                <a href="#" @click.prevent="loadOrgMembers()"
                   :class="orgTab==='members' ? 'active' : ''">
                    Mitglieder<span x-show="orgMembers.length"> (<span x-text="orgMembers.length"></span>)</span>
                </a>
            </nav>

            <!-- Sitzungen tab -->
            <div x-show="orgTab === 'meetings'">
                <p x-show="filteredMeetings.length === 0">Keine Sitzungen gefunden.</p>
                <table x-show="filteredMeetings.length > 0">
                    <thead><tr><th>Datum</th><th>Sitzung</th></tr></thead>
                    <tbody>
                        <template x-for="mtg in filteredMeetings" :key="mtg.id">
                            <tr>
                                <td style="white-space:nowrap" x-text="formatDateList(mtg.start)"></td>
                                <td>
                                    <a href="#" @click.prevent="showMeeting(mtg)"
                                       x-text="mtg.name"></a>
                                    <small x-show="mtg.location">
                                        · <span x-text="mtg.location"></span>
                                    </small>
                                </td>
                            </tr>
                        </template>
                    </tbody>
                </table>
            </div>

            <!-- Mitglieder tab -->
            <div x-show="orgTab === 'members'">
                <p x-show="orgMembersLoading" aria-busy="true"></p>
                <p x-show="!orgMembersLoading && orgMembers.length === 0">Keine Mitglieder gefunden.</p>
                <table x-show="!orgMembersLoading && orgMembers.length > 0">
                    <thead><tr><th>Name</th><th>Funktion</th><th>Fraktion/Gruppe</th></tr></thead>
                    <tbody>
                        <template x-for="m in orgMembers" :key="m.personId">
                            <tr>
                                <td x-text="m.name"></td>
                                <td x-text="m.role || '—'"></td>
                                <td>
                                    <template x-if="m.fraction">
                                        <a href="#" @click.prevent="showOrgByName(m.fraction)"
                                           x-text="m.fraction"></a>
                                    </template>
                                    <template x-if="!m.fraction"><span>—</span></template>
                                </td>
                            </tr>
                        </template>
                    </tbody>
                </table>
            </div>
        </section>
    </template>

    <!-- Persons overview -->
    <template x-if="view === 'persons' && !loading && !query.trim()">
        <section>
            <h2>Personen</h2>
            <p x-show="personsLoading" aria-busy="true"></p>
            <p x-show="!personsLoading && persons.length === 0">Keine Personen gefunden.</p>
            <table x-show="!personsLoading && persons.length > 0">
                <thead>
                    <tr><th>Name</th><th>Fraktion/Gruppe</th><th>Gremien</th></tr>
                </thead>
                <tbody>
                    <template x-for="p in persons" :key="p.id">
                        <tr>
                            <td x-text="p.name"></td>
                            <td style="white-space:nowrap">
                                <template x-if="p.memberships.find(m => m.orgType === 'Fraktion/Gruppe')">
                                    <a href="#"
                                       @click.prevent="showOrgByName(p.memberships.find(m => m.orgType === 'Fraktion/Gruppe').orgName)"
                                       x-text="p.memberships.find(m => m.orgType === 'Fraktion/Gruppe').orgName"></a>
                                </template>
                                <template x-if="!p.memberships.find(m => m.orgType === 'Fraktion/Gruppe')">
                                    <span>—</span>
                                </template>
                            </td>
                            <td>
                                <template x-for="m in p.memberships.filter(m => m.orgType !== 'Fraktion/Gruppe')" :key="m.orgId + m.role">
                                    <div>
                                        <a href="#" @click.prevent="showOrgById(m.orgId)"
                                           x-text="m.orgName"></a>
                                        <small x-show="m.role" style="color:var(--pico-muted-color)"
                                               x-text="' · ' + m.role"></small>
                                    </div>
                                </template>
                            </td>
                        </tr>
                    </template>
                </tbody>
            </table>
        </section>
    </template>

    <!-- Meeting detail (possibly split layout) -->
    <template x-if="view === 'meeting' && !loading && !query.trim()">
        <div :class="wide ? 'split-layout' : ''">

            <!-- Agenda content -->
            <section :class="wide ? 'split-content' : ''">
                <hgroup>
                    <h2 style="display:flex; align-items:center; gap:0.4em;">
                        <a :href="(municipality?.allrisBaseUrl || '') + '/to010?SILFDNR=' + meeting.id"
                           target="_blank" rel="noopener" x-text="meeting.name"></a>
                        <a :href="'/md/sitzungen/' + meeting.id" target="_blank" rel="noopener"
                           title="Markdown-Ansicht" class="md-badge">MD</a>
                    </h2>
                    <p>
                        <span x-text="formatDate(meeting.start)"></span>
                        <template x-if="meeting.location">
                            <span> · <span x-text="meeting.location"></span></span>
                        </template>
                    </p>
                </hgroup>

                <div x-show="meeting.files && meeting.files.length > 0" class="files" style="margin-bottom:1rem;">
                    <template x-for="f in meeting.files" :key="f.id">
                        <template x-if="wide">
                            <button class="outline" style="font-size:0.8em;"
                                    @click="openPdf(f)" x-text="f.name"></button>
                        </template>
                        <template x-if="!wide">
                            <a :href="'/ui/proxy/file/' + f.id" target="_blank"
                               style="font-size:0.8em;" x-text="f.name"></a>
                        </template>
                    </template>
                </div>

                <p x-show="meeting.items.length === 0">Keine Tagesordnungspunkte vorhanden.</p>

                <table x-show="meeting.items.length > 0" style="table-layout:fixed; width:100%;">
                    <thead>
                        <tr>
                            <th style="width:5.25em; white-space:nowrap;">TOP</th>
                            <th>Betreff</th>
                            <th style="width:9em;">Vorlage / Dokumente</th>
                        </tr>
                    </thead>
                    <tbody>
                        <template x-for="item in meeting.items" :key="item.id">
                            <tr :class="item.public ? '' : 'nonpublic'">
                                <td x-text="item.number || '—'"></td>
                                <td>
                                    <a :href="(municipality?.allrisBaseUrl || '') + '/to020?TOLFDNR=' + item.id"
                                       target="_blank" rel="noopener" x-text="item.name"></a>
                                    <small x-show="!item.public"> (nichtöffentlich)</small>
                                    <template x-if="item.result || item.resolutionText || item.voteText || item.wordContribution">
                                        <div class="top-detail">
                                            <template x-if="item.result">
                                                <span :class="'result-badge result-' + item.result"
                                                      x-text="resultLabel(item.result)"></span>
                                            </template>
                                            <template x-if="item.voteText">
                                                <div class="top-section"
                                                     x-html="item.voteText.split(/\n\n+/).map(p => '<p>' + p.replace(/\n/g,'<br>') + '</p>').join('')"></div>
                                            </template>
                                            <template x-if="item.resolutionText">
                                                <div class="top-section"
                                                     x-html="item.resolutionText.split(/\n\n+/).map(p => '<p>' + p.replace(/\n/g,'<br>') + '</p>').join('')"></div>
                                            </template>
                                            <template x-if="item.wordContribution">
                                                <div class="top-section"
                                                     x-html="item.wordContribution.split(/\n\n+/).map(p => '<p>' + p.replace(/\n/g,'<br>') + '</p>').join('')"></div>
                                            </template>
                                        </div>
                                    </template>
                                </td>
                                <td>
                                    <div x-show="item.paper?.reference" x-text="item.paper?.reference"
                                         style="font-size:0.85em; margin-bottom:0.25rem;"></div>
                                    <div class="files" x-show="item.paper?.files?.length">
                                        <template x-for="file in (item.paper?.files || [])" :key="file.id">
                                            <a :href="proxyUrl(file.id)"
                                               target="_blank"
                                               @click="wide && ($event.preventDefault(), openPdf(file))"
                                               x-text="file.name"
                                               :style="activePdfId === file.id ? 'font-weight:600' : ''"></a>
                                        </template>
                                    </div>
                                    <div class="files" x-show="item.files?.length">
                                        <template x-for="file in (item.files || [])" :key="file.id">
                                            <a :href="proxyUrl(file.id)"
                                               target="_blank"
                                               @click="wide && ($event.preventDefault(), openPdf(file))"
                                               x-text="file.name"
                                               :style="activePdfId === file.id ? 'font-weight:600' : ''"
                                               style="font-style:italic"></a>
                                        </template>
                                    </div>
                                </td>
                            </tr>
                        </template>
                    </tbody>
                </table>
            </section>

            <!-- Drag handle (wide only) -->
            <div x-show="wide" class="split-handle"
                 @mousedown.prevent="startResize($event)"
                 title="Breite anpassen"></div>

            <!-- PDF panel (wide only) -->
            <aside x-show="wide" class="split-pdf"
                   :style="wide ? `width:${pdfWidth}px` : ''">
                <div x-show="pdfLoading" class="pdf-loading-overlay">
                    <div class="pdf-spinner"></div>
                </div>
                <template x-if="activePdfUrl">
                    <div style="display:flex; flex-direction:column; height:100%;">
                        <div x-show="activePdfSourceUrl" style="padding:0.2rem 0.4rem; font-size:0.72em; color:var(--pico-muted-color); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; flex:0 0 auto;">
                            Quelle: <a :href="activePdfSourceUrl" target="_blank" rel="noopener"
                                       x-text="activePdfSourceLabel || activePdfSourceUrl" style="color:inherit;"></a>
                        </div>
                        <iframe :src="activePdfUrl" @load="pdfLoading = false" title="Dokument"
                                style="flex:1 1 auto; min-height:0;"></iframe>
                    </div>
                </template>
                <template x-if="!activePdfUrl">
                    <div class="pdf-placeholder">
                        Dokument auswählen<br>
                        <small>Klick auf einen Dateinamen öffnet die PDF hier</small>
                    </div>
                </template>
            </aside>
        </div>
    </template>
</main>

<footer class="container-fluid">
    <small>
        <a href="/oparl/v1.1" target="_blank">OParl API</a> ·
        <a href="/docs" target="_blank">API Docs</a>
    </small>
</footer>

<script>
function app() {
    return {
        body: null,
        view: 'orgs',
        loading: false,

        orgs: [],
        orgTypes: [],
        allMeetings: [],
        meetings: [],
        meeting: null,
        selectedOrg: null,

        orgTab: 'meetings',
        orgMembers: [],
        orgMembersLoading: false,

        persons: [],
        personsLoading: false,
        personsLoaded: false,

        query: '',
        searchResults: [],
        allLoaded: false,
        loadingAll: false,

        wide: window.innerWidth > 1024,
        pdfWidth: Math.round(Math.max(300, window.innerWidth * 0.55)),
        activePdfUrl: null,
        activePdfId: null,
        activePdfSourceUrl: null,
        activePdfSourceLabel: null,
        pdfLoading: false,
        municipality: null,

        async init() {
            window.addEventListener('resize', () => {
                this.wide = window.innerWidth > 1024;
            });

            this.loading = true;
            try {
                const [bodyRes, muniRes] = await Promise.all([
                    fetch('/oparl/v1.1/body/1'),
                    fetch('/ui/municipality'),
                ]);
                this.body = await bodyRes.json();
                this.municipality = await muniRes.json();
                document.title = this.body.systemName || 'Bürgerinformation';
                if (this.municipality?.wappenUrl) {
                    const link = document.querySelector("link[rel~='icon']") || document.createElement('link');
                    link.rel = 'icon';
                    link.href = this.municipality.wappenUrl;
                    document.head.appendChild(link);
                }
            } finally {
                this.loading = false;
            }

            this.loadingAll = true;
            Promise.all([
                fetch('/ui/all').then(r => r.json()),
                fetch('/ui/orgs').then(r => r.json()),
            ]).then(([allData, orgsData]) => {
                this.allMeetings = allData.meetings;

                // Build org map from /ui/orgs (includes orgs without meetings)
                const now = new Date().toISOString();
                const orgMap = new Map();
                for (const o of orgsData.orgs) {
                    orgMap.set(o.id, {
                        orgId: o.id, orgName: o.name, orgType: o.type,
                        lastMeeting: null, lastMeetingId: null,
                        nextMeeting: null, nextMeetingId: null,
                    });
                }

                // Overlay last/next meeting from /ui/all
                for (const m of allData.meetings) {
                    if (!m.orgId || !orgMap.has(m.orgId)) continue;
                    const org = orgMap.get(m.orgId);
                    if (m.start) {
                        if (m.start < now) {
                            if (!org.lastMeeting || m.start > org.lastMeeting) {
                                org.lastMeeting = m.start; org.lastMeetingId = m.id;
                            }
                        } else {
                            if (!org.nextMeeting || m.start < org.nextMeeting) {
                                org.nextMeeting = m.start; org.nextMeetingId = m.id;
                            }
                        }
                    }
                }

                // Sort within each type group
                const sortKey = n => n.replace(/^ausschuss\s+für\s+/i, '');
                this.orgs = [...orgMap.values()].sort((a, b) =>
                    sortKey(a.orgName).localeCompare(sortKey(b.orgName), 'de'));

                // Group by Organisationstyp preserving gr010 order
                const typeOrder = ['Rat', 'Ausschuss', 'Fraktion/Gruppe', 'Mitgliedschaften'];
                const byType = new Map();
                for (const org of this.orgs) {
                    const t = org.orgType || 'Sonstige';
                    if (!byType.has(t)) byType.set(t, []);
                    byType.get(t).push(org);
                }
                this.orgTypes = typeOrder
                    .filter(t => byType.has(t))
                    .map(t => ({ type: t, orgs: byType.get(t) }));
                // Append any unexpected types not in typeOrder
                for (const [t, orgs] of byType) {
                    if (!typeOrder.includes(t)) this.orgTypes.push({ type: t, orgs });
                }

                this.allLoaded = true;
                this.loadingAll = false;
            });
        },

        startResize(e) {
            const startX = e.clientX;
            const startW = this.pdfWidth;
            document.body.style.cursor = 'col-resize';
            document.body.style.userSelect = 'none';
            const onMove = (ev) => {
                const delta = startX - ev.clientX;
                this.pdfWidth = Math.max(180, Math.min(window.innerWidth - 250, startW + delta));
            };
            const onUp = () => {
                document.body.style.cursor = '';
                document.body.style.userSelect = '';
                document.removeEventListener('mousemove', onMove);
                document.removeEventListener('mouseup', onUp);
            };
            document.addEventListener('mousemove', onMove);
            document.addEventListener('mouseup', onUp);
        },

        showMeetings(org) {
            this.selectedOrg = org;
            this.meeting = null;
            this.activePdfUrl = null; this.activePdfSourceUrl = null; this.activePdfSourceLabel = null;
            this.activePdfId = null;
            this.view = 'meetings';
            this.orgMembers = [];
            this.meetings = this.allMeetings
                .filter(m => m.orgId === org.orgId)
                .sort((a, b) => (b.start || '').localeCompare(a.start || ''));
            if (this.meetings.length === 0) {
                this.loadOrgMembers();
            } else {
                this.orgTab = 'meetings';
            }
        },

        async loadOrgMembers() {
            this.orgTab = 'members';
            if (this.orgMembers.length > 0) return;
            this.orgMembersLoading = true;
            try {
                const r = await fetch(`/ui/org/${this.selectedOrg.orgId}/members`);
                const data = await r.json();
                this.orgMembers = data.members;
            } finally {
                this.orgMembersLoading = false;
            }
        },

        async goPersons() {
            this.view = 'persons';
            this.selectedOrg = null;
            this.meeting = null;
            this.activePdfUrl = null; this.activePdfSourceUrl = null; this.activePdfSourceLabel = null;
            this.activePdfId = null;
            if (this.personsLoaded) return;
            this.personsLoading = true;
            try {
                const r = await fetch('/ui/persons');
                const data = await r.json();
                this.persons = data.persons;
                this.personsLoaded = true;
            } finally {
                this.personsLoading = false;
            }
        },

        showOrgById(orgId) {
            const org = this.orgs.find(o => o.orgId === orgId);
            if (org) this.showMeetings(org);
        },

        showOrgByName(name) {
            const org = this.orgs.find(o => o.orgName === name);
            if (org) this.showMeetings(org);
        },

        get flatOrgRows() {
            const rows = [];
            for (const grp of this.orgTypes) {
                rows.push({ isHeader: true, type: grp.type });
                for (const org of grp.orgs) rows.push({ isHeader: false, ...org });
            }
            return rows;
        },

        get filteredMeetings() {
            return this.meetings;
        },

        async showMeeting(mtg) {
            this.view = 'meeting';
            this.activePdfUrl = null; this.activePdfSourceUrl = null; this.activePdfSourceLabel = null;
            this.activePdfId = null;
            this.loading = true;
            try {
                const r = await fetch(`/ui/meeting/${mtg.id}`);
                this.meeting = await r.json();
            } finally {
                this.loading = false;
            }
            if (this.wide && this.meeting.files && this.meeting.files.length > 0) {
                const autoFile =
                    this.meeting.files.find(f => f.name.toLowerCase().includes('protokoll')) ||
                    this.meeting.files.find(f => f.name.toLowerCase().includes('bekanntmachung')) ||
                    null;
                if (autoFile) this.openPdf(autoFile);
            }
        },

        openPdf(file) {
            this.pdfLoading = true;
            this.activePdfId = file.id;
            this.activePdfUrl = this.proxyUrl(file.id);
            this.activePdfSourceUrl = file.url || null;
            this.activePdfSourceLabel = file.displayLabel || null;
        },

        proxyUrl(fileId) {
            return `/ui/proxy/file/${fileId}`;
        },

        onSearch() {
            const q = this.query.trim().toLowerCase();
            if (!q) { this.searchResults = []; return; }

            const results = [];
            for (const mtg of this.allMeetings) {
                if (mtg.name.toLowerCase().includes(q)) {
                    results.push({
                        key: `mtg-${mtg.id}`,
                        type: 'meeting',
                        mtgId: mtg.id,
                        orgName: mtg.orgName,
                        start: mtg.start,
                        number: null,
                        name: mtg.name,
                        paperRef: null,
                    });
                }
                for (const item of mtg.items) {
                    if (
                        item.name.toLowerCase().includes(q) ||
                        (item.paperRef && item.paperRef.toLowerCase().includes(q))
                    ) {
                        results.push({
                            key: `ai-${item.id}`,
                            type: 'item',
                            mtgId: mtg.id,
                            orgId: mtg.orgId,
                            orgName: mtg.orgName,
                            start: mtg.start,
                            number: item.number,
                            name: item.name,
                            paperRef: item.paperRef,
                        });
                    }
                }
            }
            results.sort((a, b) => (b.start || '').localeCompare(a.start || ''));
            this.searchResults = results.slice(0, 100);
        },

        async openSearchResult(r) {
            this.query = '';
            this.searchResults = [];
            const mtg = this.allMeetings.find(m => m.id === r.mtgId);
            if (mtg) {
                this.selectedOrg = { orgId: mtg.orgId, orgName: mtg.orgName };
                this.meetings = this.allMeetings
                    .filter(m => m.orgId === mtg.orgId)
                    .sort((a, b) => (b.start || '').localeCompare(a.start || ''));
                await this.showMeeting(mtg);
            }
        },

        goOrgs() {
            this.view = 'orgs';
            this.selectedOrg = null;
            this.meeting = null;
            this.meetings = [];
            this.activePdfUrl = null; this.activePdfSourceUrl = null; this.activePdfSourceLabel = null;
            this.activePdfId = null;
            this.orgMembers = [];
        },

        goMeetings() {
            this.view = 'meetings';
            this.meeting = null;
            this.activePdfUrl = null; this.activePdfSourceUrl = null; this.activePdfSourceLabel = null;
            this.activePdfId = null;
        },

        highlight(text) {
            if (!text || !this.query.trim()) return text;
            const q = this.query.trim().replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            return text.replace(new RegExp(q, 'gi'), m => `<mark>${m}</mark>`);
        },

        resultLabel(result) {
            return {ACCEPTED: 'beschlossen', REJECTED: 'abgelehnt',
                    DEFERRED: 'vertagt', NODECISION: 'zur Kenntnis'}[result] || result;
        },

        formatDate(iso) {
            if (!iso) return '—';
            return new Date(iso).toLocaleString('de-DE', {
                weekday: 'short', day: '2-digit', month: 'short', year: 'numeric',
                hour: '2-digit', minute: '2-digit',
            });
        },

        formatDateShort(iso) {
            if (!iso) return '';
            return new Date(iso).toLocaleDateString('de-DE', {
                day: '2-digit', month: 'short', year: 'numeric',
            });
        },

        formatDateList(iso) {
            if (!iso) return '—';
            const d = new Date(iso);
            const opts = { day: '2-digit', month: 'short', year: 'numeric' };
            if (d >= new Date()) {
                opts.weekday = 'short';
                opts.hour = '2-digit';
                opts.minute = '2-digit';
            }
            return d.toLocaleString('de-DE', opts);
        },
    };
}
</script>
