<!DOCTYPE html>
<html lang="de" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ratsinformation</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.classless.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3/dist/cdn.min.js"></script>
    <style>
        html { font-size: 75%; }
        [x-cloak] { display: none !important; }

        .container-fluid { padding-inline: 0.75rem; }

        .breadcrumb {
            display: flex; gap: 0.4rem; align-items: center;
            flex-wrap: wrap; justify-content: flex-start;
        }
        .breadcrumb .sep { color: var(--pico-muted-color); }
        .nonpublic td { color: var(--pico-muted-color); }
        .files { display: flex; gap: 0.5rem; flex-wrap: wrap; }
        .files a, .files button { font-size: 0.85em; white-space: nowrap; }

        mark { background: #fff3cd; padding: 0 2px; border-radius: 2px; }

        .result-badge {
            display: inline-block; font-size: 0.7em; font-weight: 600;
            padding: 1px 6px; border-radius: 3px; white-space: nowrap;
            vertical-align: middle; margin-left: 0.3em;
        }
        .result-ACCEPTED  { background: #d4edda; color: #155724; }
        .result-REJECTED  { background: #f8d7da; color: #721c24; }
        .result-DEFERRED  { background: #fff3cd; color: #856404; }
        .result-NODECISION{ background: #e2e3e5; color: #383d41; }

        .top-detail { font-size: 0.85em; color: var(--pico-muted-color); margin-top: 0.3rem; }
        .top-detail p { margin: 0.15rem 0; }

        /* Split layout — flex so drag handle can resize the PDF panel */
        .split-layout {
            display: flex;
            height: calc(100vh - 12rem);
            overflow: hidden;
        }
        .split-content { flex: 1 1 auto; overflow-y: auto; min-width: 200px; }
        .split-handle {
            flex: 0 0 5px;
            cursor: col-resize;
            background: var(--pico-muted-border-color);
            margin: 0 2px;
            border-radius: 2px;
            transition: background 0.15s;
        }
        .split-handle:hover { background: var(--pico-primary); }
        .split-pdf { flex: 0 0 auto; min-width: 180px; overflow: hidden; }
        .split-pdf iframe {
            width: 100%;
            height: 100%;
            border: 1px solid var(--pico-muted-border-color);
            border-radius: var(--pico-border-radius);
            background: #f5f5f5;
        }
        .split-pdf .pdf-placeholder {
            width: 100%; height: 100%;
            display: flex; align-items: center; justify-content: center;
            border: 1px dashed var(--pico-muted-border-color);
            border-radius: var(--pico-border-radius);
            color: var(--pico-muted-color);
            font-size: 0.9em; text-align: center; padding: 2rem;
        }

        footer { margin-top: 3rem; padding-top: 1rem;
                 border-top: 1px solid var(--pico-muted-border-color); }
        td { vertical-align: top; }
        input[type=search] { margin-bottom: 0; }
        .search-result-meta { font-size: 0.8em; color: var(--pico-muted-color); }
    </style>
</head>
<body x-data="app()" x-init="init()" x-cloak>

<header class="container-fluid">
    <div style="display:flex; justify-content:space-between; align-items:center; gap:1rem; flex-wrap:wrap;">
        <hgroup style="margin:0; flex:1 1 auto;">
            <h1 x-text="body ? body.name : 'Ratsinformation'"></h1>
            <p x-show="body">
                Ratsinformationssystem ·
                <a :href="body?.website" target="_blank" x-text="body?.website"></a>
            </p>
        </hgroup>
        <div style="display:flex; align-items:center; gap:0.5rem; flex:0 0 auto;">
            <input type="search" placeholder="Suche…" x-model="query"
                   @input="onSearch()" style="width:22rem;"
                   :disabled="!allLoaded">
            <small x-show="!allLoaded && loadingAll"
                   style="color:var(--pico-muted-color); white-space:nowrap;">
                Lade Suchindex…
            </small>
        </div>
    </div>
    <nav class="breadcrumb" aria-label="Breadcrumb" style="margin-top:0.5rem;">
        <a href="#" @click.prevent="goOrgs()">Gremien</a>
        <template x-if="selectedOrg">
            <span class="sep">›</span>
        </template>
        <template x-if="selectedOrg && !meeting">
            <span x-text="selectedOrg.orgName"></span>
        </template>
        <template x-if="selectedOrg && meeting">
            <a href="#" @click.prevent="goMeetings()" x-text="selectedOrg.orgName"></a>
        </template>
        <template x-if="meeting">
            <span class="sep">›</span>
        </template>
        <template x-if="meeting">
            <span x-text="meeting.name + (meeting.start ? ' (' + formatDateShort(meeting.start) + ')' : '')"></span>
        </template>
    </nav>
</header>

<main class="container-fluid">
    <div x-show="loading" aria-busy="true" style="text-align:center;padding:2rem;"></div>

    <!-- Search results -->
    <template x-if="query.trim() && !loading">
        <section>
            <p x-show="searchResults.length === 0">Keine Ergebnisse für „<span x-text="query"></span>".</p>
            <table x-show="searchResults.length > 0">
                <thead>
                    <tr><th>Sitzung</th><th>Gremium</th><th>TOP</th><th>Betreff</th></tr>
                </thead>
                <tbody>
                    <template x-for="r in searchResults" :key="r.key">
                        <tr style="cursor:pointer" @click="openSearchResult(r)">
                            <td style="white-space:nowrap" x-text="formatDateList(r.start)"></td>
                            <td x-text="r.orgName"></td>
                            <td x-text="r.number || '—'"></td>
                            <td>
                                <span x-html="highlight(r.name)"></span>
                                <template x-if="r.paperRef">
                                    <small class="search-result-meta"> · <span x-html="highlight(r.paperRef)"></span></small>
                                </template>
                            </td>
                        </tr>
                    </template>
                </tbody>
            </table>
        </section>
    </template>

    <!-- Organisations -->
    <template x-if="view === 'orgs' && !loading && !query.trim()">
        <section>
            <h2>Gremien</h2>
            <table>
                <thead><tr><th>Gremium</th><th>Letzte Sitzung</th><th>Nächste Sitzung</th></tr></thead>
                <tbody>
                    <template x-for="org in orgs" :key="org.orgId">
                        <tr>
                            <td>
                                <a href="#" @click.prevent="showMeetings(org)"
                                   x-text="org.orgName"></a>
                            </td>
                            <td style="white-space:nowrap; color:var(--pico-muted-color)">
                                <template x-if="org.lastMeetingId">
                                    <a href="#" style="color:inherit"
                                       @click.prevent="showMeetings(org); showMeeting(allMeetings.find(m => m.id === org.lastMeetingId))"
                                       x-text="formatDateShort(org.lastMeeting)"></a>
                                </template>
                                <template x-if="!org.lastMeetingId">
                                    <span>—</span>
                                </template>
                            </td>
                            <td style="white-space:nowrap">
                                <template x-if="org.nextMeetingId">
                                    <a href="#"
                                       @click.prevent="showMeetings(org); showMeeting(allMeetings.find(m => m.id === org.nextMeetingId))"
                                       x-text="formatDateList(org.nextMeeting)"></a>
                                </template>
                                <template x-if="!org.nextMeetingId">
                                    <span>—</span>
                                </template>
                            </td>
                        </tr>
                    </template>
                </tbody>
            </table>
        </section>
    </template>

    <!-- Meetings list -->
    <template x-if="view === 'meetings' && !loading && !query.trim()">
        <section>
            <h2 x-text="selectedOrg?.orgName"></h2>
            <p x-show="filteredMeetings.length === 0">Keine Sitzungen gefunden.</p>
            <table x-show="filteredMeetings.length > 0">
                <thead><tr><th>Datum</th><th>Sitzung</th></tr></thead>
                <tbody>
                    <template x-for="mtg in filteredMeetings" :key="mtg.id">
                        <tr>
                            <td style="white-space:nowrap" x-text="formatDateList(mtg.start)"></td>
                            <td>
                                <a href="#" @click.prevent="showMeeting(mtg)"
                                   x-text="mtg.name"></a>
                                <small x-show="mtg.location">
                                    · <span x-text="mtg.location"></span>
                                </small>
                            </td>
                        </tr>
                    </template>
                </tbody>
            </table>
        </section>
    </template>

    <!-- Meeting detail (possibly split layout) -->
    <template x-if="view === 'meeting' && !loading && !query.trim()">
        <div :class="wide ? 'split-layout' : ''">

            <!-- Agenda content -->
            <section :class="wide ? 'split-content' : ''">
                <hgroup>
                    <h2 x-text="meeting.name"></h2>
                    <p>
                        <span x-text="formatDate(meeting.start)"></span>
                        <template x-if="meeting.location">
                            <span> · <span x-text="meeting.location"></span></span>
                        </template>
                    </p>
                </hgroup>

                <p x-show="meeting.items.length === 0">Keine Tagesordnungspunkte vorhanden.</p>

                <table x-show="meeting.items.length > 0">
                    <thead>
                        <tr>
                            <th style="width:5em">TOP</th>
                            <th>Betreff</th>
                            <th>Vorlage / Dokumente</th>
                        </tr>
                    </thead>
                    <tbody>
                        <template x-for="item in meeting.items" :key="item.id">
                            <tr :class="item.public ? '' : 'nonpublic'">
                                <td x-text="item.number || '—'"></td>
                                <td>
                                    <span x-text="item.name"></span>
                                    <small x-show="!item.public"> (nichtöffentlich)</small>
                                    <template x-if="item.result || item.resolutionText || item.voteText">
                                        <div class="top-detail">
                                            <template x-if="item.result">
                                                <span :class="'result-badge result-' + item.result"
                                                      x-text="resultLabel(item.result)"></span>
                                            </template>
                                            <template x-if="item.voteText">
                                                <p x-text="item.voteText"></p>
                                            </template>
                                            <template x-if="item.resolutionText">
                                                <p><em x-text="item.resolutionText"></em></p>
                                            </template>
                                        </div>
                                    </template>
                                </td>
                                <td>
                                    <div x-show="item.paper?.reference" x-text="item.paper?.reference"
                                         style="font-size:0.85em; margin-bottom:0.25rem;"></div>
                                    <div class="files" x-show="item.paper?.files?.length">
                                        <template x-for="file in (item.paper?.files || [])" :key="file.id">
                                            <a :href="proxyUrl(file.id)"
                                               target="_blank"
                                               @click="wide && ($event.preventDefault(), openPdf(file))"
                                               x-text="file.name"
                                               :style="activePdfId === file.id ? 'font-weight:600' : ''"></a>
                                        </template>
                                    </div>
                                    <div class="files" x-show="item.files?.length">
                                        <template x-for="file in (item.files || [])" :key="file.id">
                                            <a :href="proxyUrl(file.id)"
                                               target="_blank"
                                               @click="wide && ($event.preventDefault(), openPdf(file))"
                                               x-text="file.name"
                                               :style="activePdfId === file.id ? 'font-weight:600' : ''"
                                               style="font-style:italic"></a>
                                        </template>
                                    </div>
                                </td>
                            </tr>
                        </template>
                    </tbody>
                </table>
            </section>

            <!-- Drag handle (wide only) -->
            <div x-show="wide" class="split-handle"
                 @mousedown.prevent="startResize($event)"
                 title="Breite anpassen"></div>

            <!-- PDF panel (wide only) -->
            <aside x-show="wide" class="split-pdf"
                   :style="wide ? `width:${pdfWidth}px` : ''">
                <template x-if="activePdfUrl">
                    <iframe :src="activePdfUrl" title="Dokument"></iframe>
                </template>
                <template x-if="!activePdfUrl">
                    <div class="pdf-placeholder">
                        Dokument auswählen<br>
                        <small>Klick auf einen Dateinamen öffnet die PDF hier</small>
                    </div>
                </template>
            </aside>
        </div>
    </template>
</main>

<footer class="container-fluid">
    <small>
        <a href="/oparl/v1.1" target="_blank">OParl API</a> ·
        <a href="/docs" target="_blank">API Docs</a>
    </small>
</footer>

<script>
function app() {
    return {
        body: null,
        view: 'orgs',
        loading: false,

        orgs: [],
        allMeetings: [],
        meetings: [],
        meeting: null,
        selectedOrg: null,

        query: '',
        searchResults: [],
        allLoaded: false,
        loadingAll: false,

        wide: window.innerWidth > 1024,
        pdfWidth: Math.round(Math.max(300, window.innerWidth * 0.55)),
        activePdfUrl: null,
        activePdfId: null,

        async init() {
            window.addEventListener('resize', () => {
                this.wide = window.innerWidth > 1024;
            });

            this.loading = true;
            try {
                const bodyRes = await fetch('/oparl/v1.1/body/1');
                this.body = await bodyRes.json();
            } finally {
                this.loading = false;
            }

            this.loadingAll = true;
            fetch('/ui/all')
                .then(r => r.json())
                .then(data => {
                    this.allMeetings = data.meetings;
                    const now = new Date().toISOString();
                    const seen = new Map();
                    for (const m of data.meetings) {
                        if (!m.orgId) continue;
                        if (!seen.has(m.orgId)) {
                            seen.set(m.orgId, {
                                orgId: m.orgId, orgName: m.orgName,
                                lastMeeting: null, lastMeetingId: null,
                                nextMeeting: null, nextMeetingId: null,
                            });
                        }
                        const org = seen.get(m.orgId);
                        if (m.start) {
                            if (m.start < now) {
                                if (!org.lastMeeting || m.start > org.lastMeeting) {
                                    org.lastMeeting = m.start;
                                    org.lastMeetingId = m.id;
                                }
                            } else {
                                if (!org.nextMeeting || m.start < org.nextMeeting) {
                                    org.nextMeeting = m.start;
                                    org.nextMeetingId = m.id;
                                }
                            }
                        }
                    }
                    const isAusschuss = n => /ausschuss/i.test(n);
                    this.orgs = [...seen.values()].sort((a, b) => {
                        const ga = isAusschuss(a.orgName) ? 1 : 0;
                        const gb = isAusschuss(b.orgName) ? 1 : 0;
                        return ga - gb || a.orgName.localeCompare(b.orgName, 'de');
                    });
                    this.allLoaded = true;
                    this.loadingAll = false;
                });
        },

        startResize(e) {
            const startX = e.clientX;
            const startW = this.pdfWidth;
            document.body.style.cursor = 'col-resize';
            document.body.style.userSelect = 'none';
            const onMove = (ev) => {
                const delta = startX - ev.clientX;
                this.pdfWidth = Math.max(180, Math.min(window.innerWidth - 250, startW + delta));
            };
            const onUp = () => {
                document.body.style.cursor = '';
                document.body.style.userSelect = '';
                document.removeEventListener('mousemove', onMove);
                document.removeEventListener('mouseup', onUp);
            };
            document.addEventListener('mousemove', onMove);
            document.addEventListener('mouseup', onUp);
        },

        showMeetings(org) {
            this.selectedOrg = org;
            this.meeting = null;
            this.activePdfUrl = null;
            this.activePdfId = null;
            this.view = 'meetings';
            this.meetings = this.allMeetings
                .filter(m => m.orgId === org.orgId)
                .sort((a, b) => (b.start || '').localeCompare(a.start || ''));
        },

        get filteredMeetings() {
            return this.meetings;
        },

        async showMeeting(mtg) {
            this.view = 'meeting';
            this.activePdfUrl = null;
            this.activePdfId = null;
            this.loading = true;
            try {
                const r = await fetch(`/ui/meeting/${mtg.id}`);
                this.meeting = await r.json();
            } finally {
                this.loading = false;
            }
        },

        openPdf(file) {
            this.activePdfId = file.id;
            this.activePdfUrl = this.proxyUrl(file.id);
        },

        proxyUrl(fileId) {
            return `/ui/proxy/file/${fileId}`;
        },

        onSearch() {
            const q = this.query.trim().toLowerCase();
            if (!q) { this.searchResults = []; return; }

            const results = [];
            for (const mtg of this.allMeetings) {
                if (mtg.name.toLowerCase().includes(q)) {
                    results.push({
                        key: `mtg-${mtg.id}`,
                        type: 'meeting',
                        mtgId: mtg.id,
                        orgName: mtg.orgName,
                        start: mtg.start,
                        number: null,
                        name: mtg.name,
                        paperRef: null,
                    });
                }
                for (const item of mtg.items) {
                    if (
                        item.name.toLowerCase().includes(q) ||
                        (item.paperRef && item.paperRef.toLowerCase().includes(q))
                    ) {
                        results.push({
                            key: `ai-${item.id}`,
                            type: 'item',
                            mtgId: mtg.id,
                            orgId: mtg.orgId,
                            orgName: mtg.orgName,
                            start: mtg.start,
                            number: item.number,
                            name: item.name,
                            paperRef: item.paperRef,
                        });
                    }
                }
            }
            results.sort((a, b) => (b.start || '').localeCompare(a.start || ''));
            this.searchResults = results.slice(0, 100);
        },

        async openSearchResult(r) {
            this.query = '';
            this.searchResults = [];
            const mtg = this.allMeetings.find(m => m.id === r.mtgId);
            if (mtg) {
                this.selectedOrg = { orgId: mtg.orgId, orgName: mtg.orgName };
                this.meetings = this.allMeetings
                    .filter(m => m.orgId === mtg.orgId)
                    .sort((a, b) => (b.start || '').localeCompare(a.start || ''));
                await this.showMeeting(mtg);
            }
        },

        goOrgs() {
            this.view = 'orgs';
            this.selectedOrg = null;
            this.meeting = null;
            this.meetings = [];
            this.activePdfUrl = null;
            this.activePdfId = null;
        },

        goMeetings() {
            this.view = 'meetings';
            this.meeting = null;
            this.activePdfUrl = null;
            this.activePdfId = null;
        },

        highlight(text) {
            if (!text || !this.query.trim()) return text;
            const q = this.query.trim().replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            return text.replace(new RegExp(q, 'gi'), m => `<mark>${m}</mark>`);
        },

        resultLabel(result) {
            return {ACCEPTED: 'beschlossen', REJECTED: 'abgelehnt',
                    DEFERRED: 'vertagt', NODECISION: 'zur Kenntnis'}[result] || result;
        },

        formatDate(iso) {
            if (!iso) return '—';
            return new Date(iso).toLocaleString('de-DE', {
                weekday: 'short', year: 'numeric', month: '2-digit',
                day: '2-digit', hour: '2-digit', minute: '2-digit',
            });
        },

        formatDateShort(iso) {
            if (!iso) return '';
            return new Date(iso).toLocaleDateString('de-DE', {
                day: '2-digit', month: '2-digit', year: 'numeric',
            });
        },

        formatDateList(iso) {
            if (!iso) return '—';
            const d = new Date(iso);
            const opts = {weekday: 'short', year: 'numeric', month: '2-digit', day: '2-digit'};
            if (d >= new Date()) {
                opts.hour = '2-digit';
                opts.minute = '2-digit';
            }
            return d.toLocaleString('de-DE', opts);
        },
    };
}
</script>
</body>
</html>
